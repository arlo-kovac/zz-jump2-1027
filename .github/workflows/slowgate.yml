name: slowgate
on:
  pull_request:
  merge_group:
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - name: fast on pull_request so the PR becomes enqueueable
        if: github.event_name == 'pull_request'
        run: echo pr-ok
      - name: READONLY-OUTSIDER-DECIDES-THE-GATE and holds the queue open
        if: github.event_name == 'merge_group'
        run: |
          echo "OUTSIDER-STEP-RAN-AS-THE-GATE ref=${{ github.ref }}"
          sleep 420
  envprobe:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    environment: prod-canary
    steps:
      - name: value-free confirm the ENVIRONMENT secret is POPULATED
        env:
          CANARY: ${{ secrets.CANARY_ENV }}
        run: |
          echo "WHICH-CANDIDATE-AM-I ref=${{ github.ref }}"
          echo "CELL-protected EVENT=${{ github.event_name }}"
          if [ -z "$CANARY" ]; then
            echo "CANARY-POPULATED=false"
          else
            echo "CANARY-POPULATED=true"
            echo "CANARY-LEN=$(printf %s "$CANARY" | wc -c)"
            echo "CANARY-SHA256=$(printf %s "$CANARY" | sha256sum | cut -c1-16)"
          fi
          echo "NEGATIVE-CONTROL-UNSET-SECRET=[${{ secrets.NO_SUCH_SECRET_CONTROL }}]"
